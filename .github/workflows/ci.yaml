# CI gate for the CLI (PLAN §11, DEV-050): gofmt/vet/lint, tests, build, and
# dependency hygiene. The server-side e2e round-trip (register → publish →
# install → verify → yank) lives in the main repo's scripts/acceptance/
# m3-cli.sh, which resolves and exercises this CLI against a live registry —
# it does not run here because it needs the server repo.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The blaktron modules are private; the runner needs credentials to
      # fetch github.com/blaktron/agentry. The token never lands in the repo.
      - name: Authenticate for the private blaktron modules
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/blaktron/*'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: make check
        run: make check

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Authenticate for the private blaktron modules
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/blaktron/*'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
