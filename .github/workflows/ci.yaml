# CI gate for the CLI (PLAN §11, DEV-050): gofmt/vet/lint, tests, build, and
# dependency hygiene. The server-side e2e round-trip (register → publish →
# install → verify → yank) lives in the main repo's scripts/acceptance/
# m3-cli.sh, which resolves and exercises this CLI against a live registry —
# it does not run here because it needs the server repo.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # The blaktron modules are private; the runner needs credentials to
      # fetch github.com/blaktron/agentry. The token never lands in the repo.
      - name: Authenticate for the private blaktron modules
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/blaktron/*'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: make check
        run: make check
      # No client takes money (plan subscription-tiers.md D12): the CLI shows
      # a tier and a balance and sends the person to the site to upgrade.
      - name: no payment provider in the CLI
        run: |
          if grep -rIi --include='*.go' -n 'stripe' . ; then echo "::error::a payment provider reached the CLI"; exit 1; fi

  govulncheck:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      - name: Authenticate for the private blaktron modules
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE='github.com/blaktron/*'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
