# CI gate for the CLI (PLAN §11, DEV-050): gofmt/vet/lint, tests, build, and
# dependency hygiene. The server-side e2e round-trip (register → publish →
# install → verify → yank) lives in the main repo's scripts/acceptance/
# m3-cli.sh, which resolves and exercises this CLI against a live registry —
# it does not run here because it needs the server repo. `gitleaks` scans the
# commits every event brings for secrets. Every job carries the fork guard
# (below), and every action is pinned to a commit SHA (agentry-cli#165).
name: ci
on:
  push:
    # dev is the integration branch; main is production (WORKFLOW.md
    # "Branches", 2026-09-22).
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# The CI tools' versions, in one place (agentry-cli#165; the desktop's shape,
# agentry#419): no step installs anything unpinned, and scripts/pins-check.sh
# (the daily pins workflow) reads these lines to report newer releases.
# GITLEAKS_SHA256 is the checksum of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
# from the release's own gitleaks_${GITLEAKS_VERSION}_checksums.txt.
env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries the fork guard
#   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
# (agentry-cli#165; the estate's shape, agentry#419, agentry-desktop#128). This
# repository goes public at the 1.0 flip, and every job here runs on a
# persistent self-hosted runner that shares one module cache with the release
# builders. A pull request from a fork would otherwise execute its own `run:`
# steps there. The guard lives in the file, where a diff shows it; the
# repository setting "Require approval for all external contributors" stays on
# as belt-and-braces (PUBLIC-FLIP.md item 5). A fork's pull request shows these
# jobs as skipped; a maintainer who wants it built pushes its commits to a
# branch here.
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # HEAD^1 for the builtins.lock check below: a pull request's merge
          # ref's first parent is its base branch.
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # The blaktron modules are private; the runner needs credentials to
      # fetch github.com/blaktron/agentry. The token never lands in the repo —
      # and never in this container's global git config or go env either. The
      # container is long-lived, so a `--global` rewrite outlives the job that
      # wrote it and is readable by every later job that runs here, a pull
      # request's own `run:` steps included (the fork guard on this job keeps a
      # fork's out, agentry-cli#165, but the rewrite stays job-scoped) — and
      # what it reads is a token for a *different* repository's private
      # source (agentry#385). Both go
      # through the job environment instead. The job's last step removes the
      # file, and the runner wipes $RUNNER_TEMP at the start of every job,
      # which is what covers a run cancelled by `cancel-in-progress` before
      # that step could execute.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          # No rewrite without a token: an empty-credential insteadOf is worse
          # than none, turning anonymous access into a hard 401 on every
          # github.com fetch in the job. A fork's PR gets no secrets.
          if [ -n "$AGENTRY_BUILD_TOKEN" ]; then
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
            git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::AGENTRY_BUILD_TOKEN is not set; the private blaktron modules resolve only from the runner's module cache"
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: make check
        run: make check
      # Every built-in is published from its embedded tree and a published
      # version is never rebuilt, so builtins.lock is append-only
      # (agentry-cli#470): a changed tree takes a new version.
      - name: builtins.lock is append-only
        run: scripts/builtins-lock-check.sh
      # ARCHITECTURE §9's runner row names runner-r0/r1 as its evidence;
      # until agentry-cli#160 no workflow ran them. Both need no docker and
      # no registry (r2 needs a docker host and a model key, and stays a
      # manual gate — the row says so).
      - name: runner acceptance r0 + r1 (no docker)
        run: |
          scripts/acceptance/runner-r0.sh
          scripts/acceptance/runner-r1.sh
      # A release from main bakes production's registry, one from dev
      # bakes dev's, and no other commit is a release (agentry-cli#240):
      # scripts/release-registry.sh against a throwaway origin with the
      # estate's branch model, then a main build's --version read back.
      - name: release registry by branch
        run: scripts/acceptance/release-registry.sh
      # A tag's form must agree with the line its commit is on (vX.Y.Z on
      # main's, vX.Y.Z-dev.N on dev's), 1.x waits for AGENTRY_ALLOW_V1, and
      # the next tag follows the scheme (agentry-cli#327, DEV-148).
      - name: release tags by branch
        run: scripts/acceptance/release-tag.sh
      # The release signs the Windows exe (agentry-cli#196); a PR proves the
      # seam with a throwaway CA instead of the key: the checker accepts a
      # signed, timestamped binary chained to the root it is given and refuses
      # an unsigned one, a foreign root and an unexpected CN. It timestamps
      # against a public TSA (two tried), so it needs the network this job
      # already needs. Nothing in make check depends on this (plan D5).
      - name: osslsigncode and openssl from Ubuntu's packages
        run: |
          set -euo pipefail
          if ! command -v osslsigncode >/dev/null || ! command -v openssl >/dev/null; then
            sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends osslsigncode openssl
          fi
          osslsigncode --version 2>&1 | sed -n 1p
      - name: Windows signing seam, with a throwaway CA
        run: |
          set -euo pipefail
          mkdir -p dist
          GOWORK=off CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/agentry-0.0.0-windows-amd64.exe ./cmd/agentry
          scripts/acceptance/windows-signing.sh dist/agentry-0.0.0-windows-amd64.exe
      # No client takes money (plan subscription-tiers.md D12): the CLI shows
      # a tier and a balance and sends the person to the site to upgrade.
      - name: no payment provider in the CLI
        run: |
          if grep -rIi --include='*.go' -n 'stripe' . ; then echo "::error::a payment provider reached the CLI"; exit 1; fi
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  govulncheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core (agentry#225).
          cache: false
      # Job-scoped, and guarded, for the reasons the `check` job states
      # (agentry#385).
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          if [ -n "$AGENTRY_BUILD_TOKEN" ]; then
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
            git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::AGENTRY_BUILD_TOKEN is not set; the private blaktron modules resolve only from the runner's module cache"
          fi
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The pinned files image is the one agentry-dockerimages' files workflow
  # signed (agentry-cli#559): a run pulls it by digest only, so this holds
  # the pin itself to the signature, on every pull request. It needs the
  # registry and Sigstore, so it is a job of its own.
  files-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned files image is signed by the files workflow on main
        run: ./scripts/verify-files-image.sh

  # The pinned Typst image is the one agentry-dockerimages' typst workflow
  # signed, and export_pdf renders with it as the tests say (agentry-cli#730;
  # plan scratch-and-pdf-reports.md D26). The runner image copies its files by
  # digest, so the pin is held to the signature on every pull request; then
  # its renderer, fonts and packages render the tests that need the real
  # Typst (raw Typst is text, links are http or mail, only local images are
  # drawn, the PDF is tagged with every script), which may not skip here.
  typst-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The shared host module cache, as the `check` job says (agentry#225).
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned Typst image is signed by the typst workflow on main
        run: OUT="$RUNNER_TEMP/typst" ./scripts/verify-typst-image.sh
      - name: export_pdf renders with the real Typst
        env:
          AGENTRY_TYPST_REQUIRED: "1"
        run: AGENTRY_TYPST_DIR="$RUNNER_TEMP/typst" go test -count=1 ./runnerimage/toolsrv/ -run 'TestRawTypstIsText|TestLinksAreHttpOrMail|TestRealRender' -v

  # Secret scanning (agentry-cli#165): gitleaks over the commits this event
  # brings — a pull request's own range, or a push's before..after — with the
  # repository's .gitleaks.toml, failing on any hit. The binary is the release
  # tarball at the pinned version, checked against the pinned checksum before
  # it runs (the runner image's copy is not relied on). --redact: a hit names
  # the file, line and rule, never the value.
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks at the pinned version, checksum-verified
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the commits this event brings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # A push with no usable "before" (a new branch, a force-push over
            # a commit this clone does not have): the whole history.
            range="$PUSH_AFTER"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 --log-opts="$range"
