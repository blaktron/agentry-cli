# CI gate for the CLI: gofmt/vet/lint, tests, build, and dependency hygiene.
# The server-side e2e round-trip (register, publish, install, verify, yank)
# lives in the core repository's scripts/acceptance/cli.sh, which
# resolves and exercises this CLI against a live registry; it does not run
# here because it needs the server repo. `gitleaks` scans the commits every
# event brings for secrets. Every job carries the fork guard (below), and
# every action is pinned to a commit SHA.
name: ci
on:
  push:
    # dev is the integration branch; main is production.
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# The CI tools' versions, in one place: no step installs anything unpinned,
# and scripts/pins-check.sh (the daily pins workflow) reads these lines to
# report newer releases.
# GITLEAKS_SHA256 is the checksum of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
# from the release's own gitleaks_${GITLEAKS_VERSION}_checksums.txt.
env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

# One run per ref: a new push to a PR cancels the superseded run (self-hosted
# capacity is a handful of runners, not a cloud).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries the fork guard
#   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
# Every job here runs on a persistent self-hosted runner that shares one
# module cache with the release builders. A pull request from a fork would
# otherwise execute its own `run:` steps there. The guard lives in the file,
# where a diff shows it; the repository setting "Require approval for all
# external contributors" stays on as belt-and-braces. A fork's pull request
# shows these jobs as skipped; a maintainer who wants it built pushes its
# commits to a branch here.
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # HEAD^1 for the builtins.lock check below: a pull request's merge
          # ref's first parent is its base branch.
          fetch-depth: 2
      # The fork-guard check parses the workflows with PyYAML; setup-python
      # brings a clean interpreter, so PyYAML is installed rather than assumed.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3
      - name: no fork-reachable job on a self-hosted runner
        run: make workflows-check
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core.
          cache: false
      # The blaktron modules are private; the runner needs credentials to
      # fetch github.com/blaktron/agentry. The token never lands in the repo
      # and never in this container's global git config or go env either. The
      # container is long-lived, so a `--global` rewrite outlives the job that
      # wrote it and is readable by every later job that runs here, a pull
      # request's own `run:` steps included (the fork guard on this job keeps a
      # fork's out, but the rewrite stays job-scoped), and what it reads is a
      # token for a *different* repository's private source. Both go through
      # the job environment instead. The job's last step removes the
      # file, and the runner wipes $RUNNER_TEMP at the start of every job,
      # which is what covers a run cancelled by `cancel-in-progress` before
      # that step could execute.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          # No rewrite without a token: an empty-credential insteadOf is worse
          # than none, turning anonymous access into a hard 401 on every
          # github.com fetch in the job. A fork's PR gets no secrets.
          if [ -n "$AGENTRY_BUILD_TOKEN" ]; then
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
            git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::AGENTRY_BUILD_TOKEN is not set; the private blaktron modules resolve only from the runner's module cache"
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # The runner container keeps its own lint cache; the action's
          # save and restore of GitHub's cache would only duplicate it.
          skip-cache: true
      - name: make check
        run: make check
      # Every built-in is published from its embedded tree and a published
      # version is never rebuilt, so builtins.lock is append-only
      # a changed tree takes a new version.
      - name: builtins.lock is append-only
        run: scripts/builtins-lock-check.sh
      # runner-r0 and runner-r1 need no docker and no registry (r2 needs a
      # docker host and a model key, and stays a manual gate).
      - name: runner acceptance r0 + r1 (no docker)
        run: |
          scripts/acceptance/runner-r0.sh
          scripts/acceptance/runner-r1.sh
      # No client takes money: the CLI shows a tier and a balance and sends
      # the person to the site to upgrade.
      - name: no payment provider in the CLI
        run: |
          if grep -rIi --include='*.go' -n 'stripe' . ; then echo "::error::a payment provider reached the CLI"; exit 1; fi
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  govulncheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The runner shares one persistent host module cache with every other
          # runner; restoring the Actions cache over it is slow and left partial
          # modules that broke `go mod verify` in the core.
          cache: false
      # Job-scoped, and guarded, for the reasons the `check` job states.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          if [ -n "$AGENTRY_BUILD_TOKEN" ]; then
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
            git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::AGENTRY_BUILD_TOKEN is not set; the private blaktron modules resolve only from the runner's module cache"
          fi
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The pinned files image is the one agentry-dockerimages' files workflow
  # signed: a run pulls it by digest only, so this holds
  # the pin itself to the signature, on every pull request. It needs the
  # registry and Sigstore, so it is a job of its own.
  files-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned files image is signed by the files workflow on main
        run: ./scripts/verify-files-image.sh

  # The pinned hostlink image is the one agentry-dockerimages' hostlink
  # workflow signed: the host link's image is built on it,
  # pulled by digest only, so this holds the pin itself to the signature, on
  # every pull request.
  hostlink-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned hostlink image is signed by the hostlink workflow on main
        run: ./scripts/verify-hostlink-image.sh

  # The pinned browser image is the one agentry-dockerimages' browser
  # workflow signed: a run with a browser pulls it by
  # digest only, so this holds the pin itself to the signature, on every
  # pull request.
  browser-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned browser image is signed by the browser workflow on main
        run: ./scripts/verify-browser-image.sh

  # The pinned Coding agent toolchain image is the one agentry-dockerimages'
  # coder workflow signed: the Coding agent's exec container is built on it,
  # pulled by digest only, so this holds the pin itself to the signature, on
  # every pull request.
  coder-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned coder image is signed by the coder workflow on main
        run: ./scripts/verify-coder-image.sh

  # The pinned gog image is the one agentry-dockerimages' gog workflow built
  # from gog's pinned source and signed: the Google Workspace server is
  # pulled by digest only, so this holds the pin itself to the signature, on
  # every pull request.
  gog-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned gog image is signed by the gog workflow on main
        run: ./scripts/verify-gog-image.sh

  # The pinned Codex harness image is the one agentry-dockerimages' codex
  # workflow signed: the codex-image adapter's runs pull
  # it by digest only, so this holds the pin itself to the signature, on
  # every pull request.
  codex-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned Codex image is signed by the codex workflow on main
        run: ./scripts/verify-codex-image.sh

  # The default harness is the image agentry-dockerimages' docker-agent
  # workflow built from Docker Agent's pinned upstream commit and signed:
  # every run of the default adapter pulls it by digest only, so this holds
  # the pin itself to the signature, on every pull request.
  harness-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned default harness is signed by the docker-agent workflow on main
        run: ./scripts/verify-docker-agent-image.sh

  # The pinned Typst image is the one agentry-dockerimages' typst workflow
  # signed, and export_pdf renders with it as the tests say. The runner image
  # copies its files by digest, so the pin is held to the signature on every
  # pull request; then its renderer, fonts and packages render the tests that
  # need the real Typst (raw Typst is text, links are http or mail, only
  # local images are drawn, the PDF is tagged with every script, every report
  # design theme renders in every form, the image carries every family
  # pkg/reportdesign names, and pkg/reportthumbs' thumbnails are this
  # template's render), which may not skip here.
  typst-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The shared host module cache, as the `check` job says.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned Typst image is signed by the typst workflow on main
        run: OUT="$RUNNER_TEMP/typst" ./scripts/verify-typst-image.sh
      - name: export_pdf renders with the real Typst
        env:
          AGENTRY_TYPST_REQUIRED: "1"
        run: AGENTRY_TYPST_DIR="$RUNNER_TEMP/typst" go test -count=1 ./runnerimage/toolsrv/ -run 'TestRawTypstIsText|TestLinksAreHttpOrMail|TestRealRender|TestTheImageCarriesEveryDesignFamily|TestThumbnailsAreTheTemplates' -v

  # grep and glob's ripgrep: the runner image copies it from agentry-ripgrep
  # by digest, so the pin must
  # name the image the ripgrep workflow signed on main, and the tests that
  # search with the real binary (each output, context, paging within the
  # budget, hidden and ignored files, .git kept out whatever the glob, a link
  # never followed, the inputs as search_inputs reads them, a pack's
  # citations, a pattern past the size limit, and ripgrep held by Landlock
  # to the area alone where the runner's kernel has it) may not skip here.
  ripgrep-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The shared host module cache, as the `check` job says.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The pinned ripgrep image is signed by the ripgrep workflow on main
        run: OUT="$RUNNER_TEMP/ripgrep" ./scripts/verify-ripgrep-image.sh
      - name: grep and glob search with the real ripgrep
        env:
          AGENTRY_RIPGREP_REQUIRED: "1"
        run: AGENTRY_RIPGREP_BIN="$RUNNER_TEMP/ripgrep/rg" go test -count=1 ./runnerimage/toolsrv/ ./runnerimage/confine/ -run 'TestGrep|TestAGlob|TestAnInputsSearch|TestACallsGlob|TestAPacksManifest|TestAnAnswerFits|TestTheReviewsFindings|TestReadHoldsAStaticProgram' -v

  # Secret scanning: gitleaks over the commits this event brings (a pull
  # request's own range, or a push's before..after) with the repository's
  # .gitleaks.toml, failing on any hit. The binary is the release
  # tarball at the pinned version, checked against the pinned checksum before
  # it runs (the runner image's copy is not relied on). --redact: a hit names
  # the file, line and rule, never the value.
  gitleaks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks at the pinned version, checksum-verified
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the commits this event brings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! grep -qE '^0+$' <<<"$PUSH_BEFORE" && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # A push with no usable "before" (a new branch, a force-push over
            # a commit this clone does not have): the whole history.
            range="$PUSH_AFTER"
          fi
          echo "scanning $range"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source . --config .gitleaks.toml \
            --redact --no-banner --exit-code 1 --log-opts="$range"
