# main takes pull requests only from dev. Every change lands on dev and is
# checked there, and main receives it by a pull request from dev. The
# `branch-model` job is a required check on both branches, so it reports on
# every pull request: it succeeds into dev, and into main only when the head
# is this repository's own dev branch (a fork's branch named dev is refused).
#
# It runs on pull_request_target, so the workflow file is always the default
# branch's copy (dev's), whatever the pull request's base, and a pull request
# cannot edit the check it is judged by. A pull_request_target run starts for
# a fork's pull request too. The job checks out nothing, runs no code from the
# pull request, and its token has no permissions, so what it does is safe
# wherever it runs; the choice of runner is what keeps a stranger from using
# the self-hosted runners. While the repository is private only people with
# access to it can open a pull request, and the job runs on a self-hosted
# runner, which starts whether or not the account has GitHub-hosted minutes
# for private repositories. Once the repository is public the same
# expression selects a GitHub-hosted runner, so no pull request from outside
# starts a job on a self-hosted runner and nothing needs editing at that
# point. scripts/ci/workflow_guard.py accepts this exact expression, and no
# other form, for a pull_request_target job without a fork guard. The branch
# names are chosen by whoever opens the pull request, so the script reads
# them from the environment and never has them interpolated into its text.
# `edited` is among the types because changing a pull request's base branch
# is an edit, and the check must judge the new base.
name: branch-model

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-model:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: main takes pull requests only from dev
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" != main ]; then
            echo "Into $BASE: any branch may open it."
            exit 0
          fi
          if [ "$HEAD_REPO" = "$REPO" ] && [ "$HEAD" = dev ]; then
            echo "Into main from dev: a promotion."
            exit 0
          fi
          echo "::error::main takes pull requests only from $REPO:dev, and this one is from $HEAD_REPO:$HEAD. Open it against dev instead."
          exit 1
