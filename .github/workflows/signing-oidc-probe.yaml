# Proves that a job of this repository running in the `release` environment
# can obtain an Azure Artifact Signing access token with nothing but the OIDC
# token GitHub mints for it.
#
# No Azure secret exists: the Entra app registration carries one federated
# credential whose subject names this repository and the `release`
# environment, and the environment's deployment policy admits only `main`
# and `v*` tags, so a job on another branch, a pull request or a fork never
# presents that subject. The exchange is the OAuth client-credentials grant
# with the OIDC token as the client assertion: plain curl, no Azure CLI on
# the runner. The release workflow's `build` job does the same exchange and
# hands the token to jsign; this workflow proves the credential on its own
# and serves as the diagnostic.
#
# Nothing here is printed but the outcome and the OIDC token's own subject
# claim (public by construction). Both tokens reach curl through a config on
# standard input rather than argv, so they are in no process listing on
# the runner; the access token is masked, and both die with the step. The checkout is what brings scripts/signing-token.sh; it
# persists no credential.
name: signing-oidc-probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  token:
    runs-on: [self-hosted, linux, x64]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # The runner container has no jq of its own; apt at job time, as the
      # release workflow does for makensis — the container runs as root and
      # keeps the package until it is recreated.
      - name: jq from Ubuntu's packages
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null; then
            sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends jq
          fi
          jq --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # scripts/signing-token.sh is the exchange the release's Windows
      # signing runs; here it proves the credential and nothing is signed. The token it prints is masked and dropped.
      - name: Exchange the job's OIDC token for an Artifact Signing access token
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          token=$(scripts/signing-token.sh) || { echo "::error::the exchange failed; see signing-token's diagnostics above"; exit 1; }
          [ -n "$token" ] || { echo "::error::signing-token.sh printed no token"; exit 1; }
          echo "::add-mask::$token"
          unset token
          echo "an Artifact Signing access token was issued to this job for https://codesigning.azure.net; it was not printed and is gone with this step"
