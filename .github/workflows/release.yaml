# The CLI's release (agentry-cli#196; plan cli-release-signing.md; the scheme
# and the GitHub Releases of DEV-148, agentry-cli#327 and #241). A tag is one
# of two forms, and the line its commit is on must agree:
#   vX.Y.Z        on main's first-parent line: a production release, baking
#                 production's registry;
#   vX.Y.Z-dev.N  on dev's first-parent line: a dev prerelease, baking dev's.
# scripts/release-tag.sh check refuses anything else in preflight, before a
# binary is built (the line is scripts/release-registry.sh's rule,
# agentry-cli#240, DR-33), and refuses any 1.x unless the operator has set the
# repository variable AGENTRY_ALLOW_V1=true (agentry#522). An agent cuts a
# release by pushing the tag `scripts/release-tag.sh next dev|main` names
# (README "Releasing").
#
# What this does not stop (DR-33, DR-40): a pushed tag runs the workflow and
# the checks of the tagged commit's own tree, so a tag on a commit whose tree
# drops them still builds, and the `release` environment admits any v* tag.
# The checks bind a tag on main's or dev's head, which is reviewed code; a
# tag on anything else is a mistake they catch only while the tree carries
# them. Closing it needs a tag ruleset (unavailable on the current plan).
#
# The build job makes the five binaries on the Linux runner in the `release`
# environment, BUILD-INFO and SHA256SUMS, and signs what can be signed. Sign
# where signing exists, release unsigned where it does not (DEV-148; the
# operator, 2026-09-25):
#   - the Windows exe is Authenticode-signed against Azure Artifact Signing
#     over the job's OIDC token (the desktop's identity, scripts and checks,
#     agentry-desktop D-032) when the five signing variables are set
#     (agentry-cli#197), and ships unsigned when none is;
#   - SHA256SUMS is signed with the estate's update-signing key by the
#     desktop's signrelease at a pinned commit (which verifies what it wrote
#     against the committed key set) when the AGENTRY_UPDATE_SIGNING_KEY
#     secret exists, and ships without SHA256SUMS.minisig when it does not.
# A signing input that is present but half-configured, or a signature that
# fails, fails the release: "available" means configured, never a silent
# fallback. BUILD-INFO (inside the sums) and the Release's notes say which.
#
# Every tag then publishes a GitHub Release with the bundle (the publish
# job): a -dev.N tag's is a prerelease, a vX.Y.Z tag's a full release, the
# newest one the latest. Notes are generated from the commits. A minor or
# major main release (X.Y.0) is left a draft for the operator to approve its
# notes and publish (agentry-cli#241). The bundle is also the workflow
# artifact agentry-cli-<version> that the site's importer reads.
#
# workflow_dispatch runs the build as a dry run from main or a v* tag (all
# the `release` environment admits once agentry-cli#197 sets its policy),
# named by the describe string on main and by the tag, after the same check,
# on a tag; it signs exactly as a tag does (plan D8 of
# os-code-signing.md), publishes no Release, and the site's importer refuses
# its bundle by event=. Nothing in the tree's build or tests needs any of
# this (plan cli-release-signing.md D5): `make build` and `make check` work
# with no token and no signing tool.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, never cancelled by a later one: a release in flight
# finishes or fails on its own account.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  # The desktop COMMIT (agentry-desktop#172: signrelease knows -product)
  # whose internal/cmd/signrelease signs this bundle and
  # whose internal/selfupdate/keys.json is the key set the signature is
  # verified against before upload — the same key set the site's importer
  # checks (agentry-web#189). When the desktop rotates or retires a key
  # (agentry-desktop#111), this pin and this repository's
  # AGENTRY_UPDATE_SIGNING_KEY secret move together, by a pull request and the
  # operator's secret update in one operation; either alone fails the next
  # release closed (a key the set does not carry as current is refused).
  DESKTOP_SIGNRELEASE_REF: c4b13867dd9fc9783f5daf9438e964e5d7fce05d

jobs:
  # Refuses before a binary is built: a tag of neither form, one whose form
  # disagrees with its commit's line, and a 1.x without the operator. The
  # version is the tag without its v, as the desktop names its files (D-023)
  # and as the site's manifest reads a tagged release; a dispatch is named by
  # git describe, which the importer refuses as a dry run by event=
  # regardless.
  preflight:
    runs-on: [self-hosted, linux, x64]
    outputs:
      version: ${{ steps.tag.outputs.version || steps.dryrun.outputs.version }}
      channel: ${{ steps.tag.outputs.channel || steps.dryrun.outputs.channel }}
      registry: ${{ steps.tag.outputs.registry || steps.dryrun.outputs.registry }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      latest: ${{ steps.tag.outputs.latest }}
      draft: ${{ steps.tag.outputs.draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The origin/main and origin/dev refs and every tag: the line rule
          # and the latest-release check read them.
          fetch-depth: 0
          persist-credentials: false
      - name: The tag, its line and what it releases
        id: tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          AGENTRY_ALLOW_V1: ${{ vars.AGENTRY_ALLOW_V1 }}
        run: |
          set -euo pipefail
          if ! out=$(scripts/release-tag.sh check "$TAG" "$GITHUB_SHA" 2>"$RUNNER_TEMP/tag-check.err"); then
            echo "::error::$(cat "$RUNNER_TEMP/tag-check.err")"; exit 1
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "::notice::$TAG is a $(sed -n 's/^channel=//p' <<<"$out") release of $GITHUB_SHA"
      # A dispatch is a dry run: named by describe, the registry by the
      # commit's line as a tag's would be.
      - name: The dry run's name and registry
        id: dryrun
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          v=$(git describe --tags --always 2>/dev/null | sed 's/^v//')
          # The name lands in file names and the Makefile's command line.
          [[ $v =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]] || { echo "::error::git describe gave '$v', not a version name"; exit 1; }
          out=$(scripts/release-registry.sh "${GITHUB_SHA}")
          printf '%s\n' "$out"
          { echo "version=$v"
            sed -n -e 's/^AGENTRY_RELEASE_CHANNEL=/channel=/p' -e 's/^AGENTRY_DEFAULT_REGISTRY=/registry=/p' <<<"$out"
          } >> "$GITHUB_OUTPUT"
          echo "dry run $v (${GITHUB_EVENT_NAME} on ${GITHUB_REF})"

  build:
    needs: preflight
    runs-on: [self-hosted, linux, x64]
    # The `release` environment is what the Windows signing credential is
    # scoped to (agentry-cli#197; the desktop's #151): the Entra federated
    # credential matches a job of this repository in this environment and
    # nothing else, and the environment admits only main and v* tags.
    # id-token lets the job mint the OIDC token it exchanges; contents: read
    # is what checkout needs and is repeated because a job-level permissions
    # block replaces the workflow's.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      AGENTRY_DEFAULT_REGISTRY: ${{ needs.preflight.outputs.registry }}
      AGENTRY_RELEASE_CHANNEL: ${{ needs.preflight.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # Shared persistent host module cache; restoring the Actions cache
          # over it left partial modules in the core (agentry#225).
          cache: false
      # Job-scoped on this persistent runner, removed at the end (the
      # desktop's #92 shape): the token reaches a file the job deletes, not
      # the runner's global git config.
      - name: Authenticate for the private blaktron modules (job-scoped)
        env:
          AGENTRY_BUILD_TOKEN: ${{ secrets.AGENTRY_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
          echo "GOPRIVATE=github.com/blaktron/*" >> "$GITHUB_ENV"
          git config --file "$RUNNER_TEMP/gitconfig" url."https://x-access-token:${AGENTRY_BUILD_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: What this release bakes in
        run: |
          set -euo pipefail
          # The registry is preflight's (scripts/release-registry.sh), not
          # this file's: required, so an empty output cannot bake the
          # source default.
          : "${AGENTRY_DEFAULT_REGISTRY:?preflight named no registry for this commit}"
          : "${AGENTRY_RELEASE_CHANNEL:?preflight named no channel for this commit}"
          echo "default registry ${AGENTRY_DEFAULT_REGISTRY}"
          set -a; . build/release.env; set +a
          # The CN the Windows signature must carry: required, so a blanked
          # line cannot quietly turn the check into "any Artifact Signing
          # customer" (the pinned root is shared).
          : "${AGENTRY_WINDOWS_SIGNING_CN:?build/release.env must set AGENTRY_WINDOWS_SIGNING_CN}"
          echo "AGENTRY_WINDOWS_SIGNING_CN=${AGENTRY_WINDOWS_SIGNING_CN}" >> "$GITHUB_ENV"
      # Which signatures this repository can make today (DEV-148: sign where
      # available, release unsigned where not). All five Windows variables or
      # none; the update-signing secret or not. Half a configuration is a
      # mistake, not "unavailable", and fails the release.
      - name: What can be signed here
        id: signing
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          HAS_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRY_UPDATE_SIGNING_KEY != '' }}
          # Set to true by agentry-cli#197's wizard once signing exists: from
          # then on a missing input fails the release rather than shipping
          # unsigned, so removing a credential cannot quietly turn signing off.
          REQUIRE_SIGNING: ${{ vars.AGENTRY_REQUIRE_SIGNING }}
        run: |
          set -euo pipefail
          set_=0; unset_=""
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE; do
            if [ -n "${!v:-}" ]; then set_=$((set_ + 1)); else unset_="$unset_ $v"; fi
          done
          case "$set_" in
            5) echo "windows=sign" >> "$GITHUB_OUTPUT"; echo "Windows: Authenticode against Artifact Signing" ;;
            0) [ "$REQUIRE_SIGNING" != true ] || { echo "::error::AGENTRY_REQUIRE_SIGNING is true and no Windows signing variable is set (agentry-cli#197)"; exit 1; }
               echo "windows=none" >> "$GITHUB_OUTPUT"
               echo "::warning::No Windows signing variables on this repository (agentry-cli#197): the Windows exe ships unsigned (an empty signed_windows= in BUILD-INFO), and the Release says so." ;;
            *) echo "::error::Windows signing is half-configured: unset$unset_. Set all five (the desktop's artifact-signing-setup.sh --repo blaktron/agentry-cli, agentry-cli#197) or none."; exit 1 ;;
          esac
          if [ "$HAS_UPDATE_SIGNING_KEY" = true ]; then
            echo "sums=sign" >> "$GITHUB_OUTPUT"; echo "SHA256SUMS: the estate's update-signing key"
          else
            [ "$REQUIRE_SIGNING" != true ] || { echo "::error::AGENTRY_REQUIRE_SIGNING is true and the AGENTRY_UPDATE_SIGNING_KEY secret is missing (agentry-cli#197)"; exit 1; }
            echo "sums=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No AGENTRY_UPDATE_SIGNING_KEY secret on this repository (agentry-cli#197): SHA256SUMS ships unsigned, with no SHA256SUMS.minisig, and BUILD-INFO and the Release say so."
          fi
      # The five binaries, unsigned, from the Makefile's own target: what a
      # person builds locally is what ships, and this step reads nothing
      # signing-related (plan D5).
      - name: The five binaries
        run: |
          set -euo pipefail
          make dist DIST_VERSION="$VERSION" AGENTRY_DEFAULT_REGISTRY="$AGENTRY_DEFAULT_REGISTRY"
          # -X on a symbol that moved fails silently; the URL and the version
          # must be in the binaries. The runner is linux/amd64: run that one.
          for f in dist/agentry-"$VERSION"-*; do
            grep -a -F "$AGENTRY_DEFAULT_REGISTRY" "$f" >/dev/null || { echo "::error::$(basename "$f") does not carry $AGENTRY_DEFAULT_REGISTRY"; exit 1; }
          done
          out=$(./dist/agentry-"$VERSION"-linux-amd64 --version)
          echo "$out"
          grep -F "$VERSION" <<<"$out" >/dev/null || { echo "::error::the binary reports '$out', not version $VERSION"; exit 1; }
          grep -xF "default registry: $AGENTRY_DEFAULT_REGISTRY" <<<"$out" >/dev/null || { echo "::error::the binary reports '$out', not default registry $AGENTRY_DEFAULT_REGISTRY"; exit 1; }
      - name: java, osslsigncode, jq and openssl from Ubuntu's packages
        if: steps.signing.outputs.windows == 'sign'
        run: |
          set -euo pipefail
          if ! command -v java >/dev/null || ! command -v osslsigncode >/dev/null || ! command -v jq >/dev/null || ! command -v openssl >/dev/null; then
            sudo=""; [ "$(id -u)" = 0 ] || sudo=sudo
            $sudo apt-get update -qq
            $sudo apt-get install -y -qq --no-install-recommends default-jre-headless osslsigncode jq openssl
          fi
          java -version 2>&1 | sed -n 1p; osslsigncode --version 2>&1 | sed -n 1p
      - name: jsign at the pinned digest
        if: steps.signing.outputs.windows == 'sign'
        run: scripts/sign-windows.sh fetch "$RUNNER_TEMP"
      # Authenticode (agentry-cli#196; agentry-desktop D-032). The job proves
      # who it is with the OIDC token GitHub minted for it and gets an Azure
      # access token for the signing service in return (scripts/signing-token.sh:
      # no Azure secret, both tokens via curl's stdin config, never argv); the
      # access token is masked, lives in this step's shell, and reaches jsign
      # through the environment of the one command that signs
      # (`--storepass env:`), so it is in no process listing. Configured, it
      # must succeed: a refused exchange or a jsign failure fails the release.
      - name: Sign the Windows exe (Artifact Signing over OIDC)
        if: steps.signing.outputs.windows == 'sign'
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          token=$(scripts/signing-token.sh) || { echo "::error::no signing token: the release environment's federated credential (agentry-cli#197) must match this job's OIDC subject"; exit 1; }
          [ -n "$token" ] || { echo "::error::signing-token.sh printed no token"; exit 1; }
          echo "::add-mask::$token"
          echo "signing as $ARTIFACT_SIGNING_ACCOUNT/$ARTIFACT_SIGNING_PROFILE at $ARTIFACT_SIGNING_ENDPOINT"
          AGENTRY_SIGNING_TOKEN="$token" JSIGN_JAR="$RUNNER_TEMP/jsign.jar" scripts/sign-windows.sh "dist/agentry-$VERSION-windows-amd64.exe"
      # The read-back: one signature, timestamped, chain to the pinned
      # Microsoft root, the CN release.env names; the report goes into
      # BUILD-INFO. Unsigned, the line says so.
      - name: Verify the Windows signature
        id: verify
        env:
          WINDOWS: ${{ steps.signing.outputs.windows }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          # Unsigned is the empty value in the grammar the site's importer
          # reads (agentry-web's manifest.py: empty, or authenticode …).
          if [ "$WINDOWS" != sign ]; then
            echo "signed_windows=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          scripts/check-windows-binary.sh --report "$RUNNER_TEMP/windows-signing.txt" "dist/agentry-$VERSION-windows-amd64.exe"
          cn=$(sed -n 's/^cn=//p' "$RUNNER_TEMP/windows-signing.txt"); ts=$(sed -n 's/^timestamp=//p' "$RUNNER_TEMP/windows-signing.txt"); root=$(sed -n 's/^root=//p' "$RUNNER_TEMP/windows-signing.txt")
          [ -n "$cn" ] && [ -n "$ts" ] && [ -n "$root" ] || { cat "$RUNNER_TEMP/windows-signing.txt"; echo "::error::the signing report is incomplete"; exit 1; }
          # The grammar the site's importer reads (agentry-web#189): the keys in
          # this order, each value running to the next key.
          echo "signed_windows=authenticode CN=$cn profile=$ARTIFACT_SIGNING_ACCOUNT/$ARTIFACT_SIGNING_PROFILE timestamp=$ts verified=osslsigncode root=$root" >> "$GITHUB_OUTPUT"
      # One bundle: the binaries, BUILD-INFO saying what built them, what
      # they bake in and what is signed, SHA256SUMS over all of it — every
      # file but SHA256SUMS itself — and, when the key exists,
      # SHA256SUMS.minisig, the estate's own signature over the sums.
      - name: BUILD-INFO and SHA256SUMS
        env:
          SIGNED_WINDOWS: ${{ steps.verify.outputs.signed_windows }}
          WINDOWS: ${{ steps.signing.outputs.windows }}
          SUMS: ${{ steps.signing.outputs.sums }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp dist/agentry-"$VERSION"-* bundle/
          # Signing was configured, so the verify step must have reported it.
          [ "$WINDOWS" != sign ] || [ -n "$SIGNED_WINDOWS" ] || { echo "::error::the verify step reported no Windows signature, and a configured signature that is missing does not complete"; exit 1; }
          case "$SUMS" in sign) signed_sums=minisign ;; *) signed_sums=none ;; esac
          {
            echo "product=agentry-cli"
            echo "version=$VERSION"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "commit=${GITHUB_SHA}"
            echo "default_registry=${AGENTRY_DEFAULT_REGISTRY}"
            echo "channel=${AGENTRY_RELEASE_CHANNEL}"
            # signed= is true only when EVERY artifact is OS-signed; the
            # per-platform lines say which are. Windows here; macOS is #198.
            echo "signed=false"
            # Empty when the exe is unsigned (the site's grammar).
            echo "signed_windows=${SIGNED_WINDOWS}"
            # The estate's signature over SHA256SUMS: minisign (the file
            # SHA256SUMS.minisig beside it) or none (DEV-148).
            echo "signed_sums=${signed_sums}"
            echo "built_by=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > bundle/BUILD-INFO
          cat bundle/BUILD-INFO
          cd bundle
          sha256sum agentry-* BUILD-INFO > SHA256SUMS
          sha256sum -c SHA256SUMS
          for want in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64.exe; do
            [ -f "agentry-$VERSION-$want" ] || { echo "::error::agentry-$VERSION-$want is missing"; exit 1; }
          done
          cat SHA256SUMS
      # The signer is the desktop's, installed by module path at the pinned
      # commit — its own step, so the compiler and git run nowhere near the
      # key: it embeds that commit's key set and refuses to sign with a key
      # the set does not carry as current. The module is private; the
      # job-scoped credential above resolves it.
      - name: The desktop's signrelease at the pinned commit
        if: steps.signing.outputs.sums == 'sign'
        run: GOBIN="$RUNNER_TEMP" go install "github.com/blaktron/agentry-desktop/internal/cmd/signrelease@${DESKTOP_SIGNRELEASE_REF}"
      # The private half is an Actions secret, piped to the signer on stdin,
      # never written to disk, dropped from the signer's own environment
      # (agentry-desktop D-026). -product agentry-cli: the signed trusted
      # comment names THIS product ("agentry-cli <version> (commit <sha>)",
      # agentry-desktop#171), and the signer refuses to sign sums whose
      # artifact names are not the CLI's; the desktop's update check reads
      # only its own product's comment, so this bundle can never be offered
      # to the desktop as an update, whatever manifest names it.
      - name: Sign SHA256SUMS with the estate's update-signing key
        if: steps.signing.outputs.sums == 'sign'
        env:
          AGENTRY_UPDATE_SIGNING_KEY: ${{ secrets.AGENTRY_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "${AGENTRY_UPDATE_SIGNING_KEY}" \
            | env -u AGENTRY_UPDATE_SIGNING_KEY "$RUNNER_TEMP/signrelease" \
                -key - \
                -in bundle/SHA256SUMS \
                -product agentry-cli \
                -version "$VERSION" \
                -commit "${GITHUB_SHA}"
          cat bundle/SHA256SUMS.minisig
      - name: Remove the signing binary and the report
        if: always()
        run: rm -f "$RUNNER_TEMP/signrelease" "$RUNNER_TEMP/windows-signing.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentry-cli-${{ needs.preflight.outputs.version }}
          path: bundle/
          if-no-files-found: error
          retention-days: 90
      - name: Remove the job-scoped git credential
        if: always()
        run: rm -f "$RUNNER_TEMP/gitconfig"

  # The GitHub Release (agentry-cli#241, DEV-148): every tag, never a dry
  # run. The bundle exactly as built and summed; notes generated from the
  # commits under a header that says what is signed and how to check it. A
  # minor or major main release is a draft until the operator approves its
  # notes and publishes it.
  publish:
    needs: [preflight, build]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      # Into this job's own temporary directory: the self-hosted runner keeps
      # its workspace between jobs, and a bundle/ left by an earlier release
      # there would ride along into files: below.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentry-cli-${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}/bundle
      - name: The notes' header
        env:
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          REGISTRY: ${{ needs.preflight.outputs.registry }}
          DRAFT: ${{ needs.preflight.outputs.draft }}
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/bundle"
          info() { sed -n "s/^$1=//p" "$b/BUILD-INFO"; }
          [ "$(info version)" = "$VERSION" ] || { echo "::error::BUILD-INFO names $(info version), not $VERSION"; exit 1; }
          (cd "$b" && sha256sum -c SHA256SUMS)
          # Exactly what the sums cover, plus the sums and their signature.
          extra=$(cd "$b" && for f in *; do case "$f" in SHA256SUMS|SHA256SUMS.minisig) ;; *) grep -F "  $f" SHA256SUMS >/dev/null || echo "$f" ;; esac; done)
          [ -z "$extra" ] || { echo "::error::files the sums do not cover: $extra"; exit 1; }
          win=$(info signed_windows); sums=$(info signed_sums)
          case "$CHANNEL" in
            production) what="A production release: its binaries talk to $REGISTRY by default." ;;
            *) what="A dev prerelease, for testing on dev: its binaries talk to $REGISTRY by default." ;;
          esac
          case "$win" in
            "") winl="unsigned: no signing credential is configured yet (agentry-cli#197)" ;;
            "authenticode "*) winl="Authenticode-signed (${win%% profile=*})" ;;
            *) echo "::error::BUILD-INFO signed_windows='$win' is neither empty nor authenticode"; exit 1 ;;
          esac
          case "$sums" in minisign|none) ;; *) echo "::error::BUILD-INFO signed_sums='$sums' is neither minisign nor none"; exit 1 ;; esac
          [ "$sums" != minisign ] || [ -f "$b/SHA256SUMS.minisig" ] || { echo "::error::BUILD-INFO says the sums are signed and there is no SHA256SUMS.minisig"; exit 1; }
          if [ "$sums" = minisign ]; then sumsl="signed with the estate's update-signing key: \`SHA256SUMS.minisig\`, checked against the key set in agentry-desktop's \`internal/selfupdate/keys.json\`"; else sumsl="not signed: no update-signing key is configured yet (agentry-cli#197), so there is no \`SHA256SUMS.minisig\`"; fi
          {
            echo "$what"
            echo
            echo "**Signatures** (DEV-148: signed where signing exists, unsigned where it does not):"
            echo "- Windows \`agentry-$VERSION-windows-amd64.exe\`: $winl."
            echo "- macOS: not signed or notarised yet (agentry-cli#198)."
            echo "- \`SHA256SUMS\`: $sumsl."
            echo
            echo "Check a download against the sums: \`sha256sum -c --ignore-missing SHA256SUMS\`. \`BUILD-INFO\` (covered by the sums) records the commit, the channel, the registry and the signatures; \`agentry --version\` prints the version and the registry."
            [ "$DRAFT" = true ] && { echo; echo "_A minor release: drafted for the operator to approve these notes and publish._"; }
            echo
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: The GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: agentry-cli ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: ${{ runner.temp }}/bundle/*
          fail_on_unmatched_files: true
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          draft: ${{ needs.preflight.outputs.draft }}
          make_latest: ${{ needs.preflight.outputs.latest }}
