# gitleaks configuration for the CLI (agentry-cli#165; the estate's shape,
# agentry#419). The CI job `gitleaks` scans every pull request's commits and
# every push with it. The default rules apply. A full-history scan when this
# file was added (147 commits, 2026-09-24) was clean with the pinned 8.30.1;
# the workstation's newer build flagged two fake values in tests, allowlisted
# below by their file AND their value (so the same file still fails on any
# other secret-shaped string) so that a rule-set bump does not redden on them.
# A new false positive gets the same narrow entry, with the reason beside it;
# never a whole tree.
[extend]
useDefault = true

[[allowlists]]
description = "fake values in tests: the redactor's own run token, and a setup transcript's placeholder digest"
condition = "AND"
regexTarget = "match"
paths = [
  '''^pkg/runner/engine/redact_test\.go$''',
  '''^pkg/runner/setup/setup_test\.go$''',
]
regexes = [
  '''tok-0123456789''',
  '''abcdef123456''',
]

[[allowlists]]
description = "a fake Jev key in the Drafter's engine test, which holds the agent container to having no key of the person's (agentry-cli#345)"
condition = "AND"
regexTarget = "match"
paths = ['''^pkg/runner/engine/web_test\.go$''']
regexes = ['''jev-person-key-0123456789abcdef''']

[[allowlists]]
description = "the probe client secret of the connections test, searched for raw and base64 to prove a run never holds one (agentry-cli#664, plan D8)"
condition = "AND"
regexTarget = "match"
paths = ['''^cmd/agentry/cmd_connections_test\.go$''']
regexes = ['''PROBE-SECRET-d8-condition''']

[[allowlists]]
description = "the fake OpenAI's ID token header (an unsigned JWT's literal {\"alg\":\"RS256\"}), which the ChatGPT sign-in tests read claims from and probe-search a run for (agentry-cli#739)"
condition = "AND"
regexTarget = "match"
paths = ['''^pkg/mcpauth/mcpauthtest/chatgpt\.go$''']
regexes = ['''eyJhbGciOiJSUzI1NiJ9''']
