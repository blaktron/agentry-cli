# gitleaks configuration for the CLI. The CI job `gitleaks` scans every pull
# request's commits and every push with it. The default rules apply. Fake
# values in tests are allowlisted below by their file AND their value (so the
# same file still fails on any other secret-shaped string), so that a rule-set
# bump does not fail on them. A new false positive gets the same narrow entry,
# with the reason beside it; never a whole tree.
[extend]
useDefault = true

[[allowlists]]
description = "fake values in tests: the redactor's own run token, and a setup transcript's placeholder digest"
condition = "AND"
regexTarget = "match"
paths = [
  '''^pkg/runner/engine/redact_test\.go$''',
  '''^pkg/runner/setup/setup_test\.go$''',
]
regexes = [
  '''tok-0123456789''',
  '''abcdef123456''',
]

[[allowlists]]
description = "a fake Jev key in the Drafter's engine test, which holds the agent container to having no key of the person's"
condition = "AND"
regexTarget = "match"
paths = ['''^pkg/runner/engine/web_test\.go$''']
regexes = ['''jev-person-key-0123456789abcdef''']

[[allowlists]]
description = "the probe client secret of the connections test, searched for raw and base64 to prove a run never holds one"
condition = "AND"
regexTarget = "match"
paths = ['''^cmd/agentry/cmd_connections_test\.go$''']
regexes = ['''PROBE-SECRET-d8-condition''']

[[allowlists]]
description = "the fake OpenAI's ID token header (an unsigned JWT's literal {\"alg\":\"RS256\"}), which the ChatGPT sign-in tests read claims from and probe-search a run for"
condition = "AND"
regexTarget = "match"
paths = ['''^pkg/mcpauth/mcpauthtest/chatgpt\.go$''']
regexes = ['''eyJhbGciOiJSUzI1NiJ9''']

[[allowlists]]
description = "the target host live test's planted AWS key id and GitHub token, printed on a throwaway sshd to prove a host's own keys reach the agent unchanged past the gateway's secret block"
condition = "AND"
regexTarget = "match"
paths = ['''^pkg/runner/engine/targethosts_live_test\.go$''']
regexes = ['''AKIAQ3EGRQ5WJ2LZ7HXN''', '''ghp_R8mZq2LkVb1x9Nw4Ty7Pc3Ha6Sd0Fg5Jk2Lp''']

[[allowlists]]
description = "a fake private key header and body line in the host link's test, the shape its scrub masks"
condition = "AND"
regexTarget = "match"
paths = ['''^runnerimage/hostlink/server_test\.go$''']
regexes = ['''b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW''']

[[allowlists]]
description = "the fake signing secret the delivery tests plant to prove it reaches the delivery step's stdin and nowhere else"
condition = "AND"
regexTarget = "match"
paths = [
  '''^pkg/runner/engine/destinations_test\.go$''',
  '''^runnerimage/send/send_test\.go$''',
]
regexes = ['''whsec_PLANTEDsigningSECRET0123456789''']
