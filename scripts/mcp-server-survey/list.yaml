# The servers the survey installs and starts (README.md, "The list").
# egress, env and secrets are what a QuickAgent would declare for the
# server, from its README; a secret gets a placeholder value, never a key.
# call is one read-only tool call that needs no key, where one exists.

# --- Every server a published QuickAgent declares (dev and production, 2026-10-05)
- ecosystem: npm
  package: "@cyanheads/osv-advisory-mcp-server"
  why: registry (dev, production)
  egress: [api.osv.dev]
  call: {tool: osv_query_package, arguments: {ecosystem: PyPI, name: flask, version: "0.12"}}
- ecosystem: npm
  package: frankfurter-mcp-server
  why: registry (dev)
  egress: [api.frankfurter.dev]
  call: {tool: frankfurter_get_latest_rates, arguments: {base: EUR}}
- ecosystem: npm
  package: github-mcp-server-js
  why: registry (dev)
  egress: [api.github.com]
  secrets: [GITHUB_TOKEN]
  env: {GITHUB_PERMISSION: read-only}
- ecosystem: npm
  package: "@bytebase/dbhub"
  why: registry (dev)
- ecosystem: npm
  package: "@modelcontextprotocol/sdk"
  why: registry (dev)
  note: the MCP TypeScript SDK, declared by a published dev release as if it were a server
- ecosystem: npm
  package: "@aryanbv/pdf-toolkit-mcp"
  why: registry (production)
  call: {tool: pdf_get_metadata, arguments: {filePath: /inputs/report.pdf}}
  note: its tools take local file paths; the call asks for a path where a run's inputs would be
- ecosystem: pypi
  package: markitdown-mcp
  why: registry (production)

# --- The MCP reference servers (modelcontextprotocol/servers), current
- ecosystem: npm
  package: "@modelcontextprotocol/server-everything"
  why: reference
  call: {tool: echo, arguments: {message: survey}}
- ecosystem: npm
  package: "@modelcontextprotocol/server-filesystem"
  why: reference
- ecosystem: npm
  package: "@modelcontextprotocol/server-memory"
  why: reference
  call: {tool: read_graph}
- ecosystem: npm
  package: "@modelcontextprotocol/server-sequential-thinking"
  why: reference
  call: {tool: sequentialthinking, arguments: {thought: survey, nextThoughtNeeded: false, thoughtNumber: 1, totalThoughts: 1}}
- ecosystem: pypi
  package: mcp-server-fetch
  why: reference
  egress: [example.com]
  call: {tool: fetch, arguments: {url: "https://example.com/"}}
- ecosystem: pypi
  package: mcp-server-git
  why: reference
  call: {tool: git_status, arguments: {repo_path: /tmp}}
- ecosystem: pypi
  package: mcp-server-time
  why: reference
  call: {tool: get_current_time, arguments: {timezone: UTC}}

