# Vendors' own remote MCP servers:
# declared by url with an auth, reached through the runner image's bridge
# behind one relay to the address's host. seen is true only for a server
# that answered a tool call through Agentry; the others are what the
# vendor's metadata said, read anonymously on the date given. client says
# who an OAuth sign-in's client is: agentry (the vendor lets Agentry
# register itself) or own (the person brings their own OAuth client).
remote:
- vendor: Linear
  url: https://mcp.linear.app/mcp
  auth: oauth
  scopes: [read, write]
  client: agentry
  seen: true
  observed: A consent and two hosted runs listed the person's issues; the vendor registers Agentry's client itself (dynamic registration and a client metadata document).
  evidence: a consent and two hosted runs, 2026-10-07
  date: 2026-10-07
- vendor: GitHub
  url: https://api.githubcopilot.com/mcp/readonly
  auth: secret
  seen: true
  observed: A local run reached GitHub's read-only tools with a GitHub token sent as the bearer header.
  conditions:
    - "One key: a GitHub token, declared as the server's one secret."
  evidence: a local run, 2026-10-05
  date: 2026-10-05
- vendor: GitHub
  url: https://api.githubcopilot.com/mcp/readonly
  auth: oauth
  scopes: [repo, read:org, read:user, user:email, read:packages, write:packages, read:project, project, gist, notifications]
  client: own
  seen: false
  observed: The read-only tools, signed in to by OAuth. Its metadata names github.com/login/oauth, which offers neither dynamic registration nor a client metadata document, so the person brings their own OAuth App. GitHub has no read-only scope for private repositories, so a task that reads them asks for repo.
  evidence: vendor metadata read 2026-10-09
  date: 2026-10-09
