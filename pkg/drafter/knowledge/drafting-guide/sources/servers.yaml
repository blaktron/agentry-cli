- vendor: Google
  url: https://gmailmcp.googleapis.com/mcp/v1
  auth: oauth
  scopes: [https://www.googleapis.com/auth/gmail.readonly]
  client: own
  seen: false
  observed: Google's Gmail server is in its Workspace Developer Preview, which an account must join, and has no tool that sends mail. Google offers neither dynamic registration nor a client metadata document, so the person brings their own Google OAuth client. For Gmail without the preview, the listed sign-in of the PyPI package workspace-mcp is the alternative.
  evidence: vendor metadata read 2026-10-09
  date: 2026-10-09
# Package servers' OAuth sign-ins seen working. A draft
# gives a package an oauth block only by copying one of these exactly, with
# the egress and env it lists: a token file the package does not read fails
# silently at run time, so a block nobody saw work is not written.
signins:
- ecosystem: pypi
  package: workspace-mcp
  versions: 2.0.1
  egress: [gmail.googleapis.com]
  env:
    MCP_SINGLE_USER_MODE: "1"
    WORKSPACE_MCP_TOOLS: gmail
    WORKSPACE_MCP_READ_ONLY: "true"
    USER_GOOGLE_EMAIL: me@agentry.invalid
  oauth:
    issuer: https://accounts.google.com
    scopes: [https://www.googleapis.com/auth/gmail.readonly]
    files:
      - path: me@agentry.invalid.json
        template: '{"token": "{access_token}", "expiry": "{expiry}", "scopes": ["https://www.googleapis.com/auth/gmail.readonly"], "token_uri": "https://oauth2.googleapis.com/token", "client_id": "agentry", "client_secret": "agentry"}'
    env:
      WORKSPACE_MCP_CREDENTIALS_DIR: "{dir}"
  client: own
  observed: Read the person's Gmail inbox on a run, and again 65 minutes later after the runner renewed the token mid-run. The file is named for USER_GOOGLE_EMAIL, and client_id and client_secret are fixed dummies, never a real client's.
  evidence: a local run, and its renewal 65 minutes later, 2026-10-06
  date: 2026-10-06
