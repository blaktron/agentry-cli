# The drafting guide's two soft lists of declared MCP servers, Runs here
# and Does not run here, and the packages whose presence as a server's
# direct dependency means it does not run here. Written by hand from the
# survey's results
# (scripts/mcp-server-survey); the two list pages are generated from it
# (go test ./pkg/drafter -run TestTheDraftingGuideIsCurrent -update).
#
# A list is one thing to look at when drafting, never a gate. An entry says
# what was observed, on which runtime, on which date; never that a server is
# safe or good. An entry comes off when the runner gains what the server
# lacked. reason is a class of the closed set in pkg/drafter/serverlist.go.
servers:
- ecosystem: npm
  package: "@aryanbv/pdf-toolkit-mcp"
  versions: 0.3.1
  list: does-not-run-here
  reason: needs-run-files
  runtime: Node 24.21.0
  observed: Started and listed its tools; a call of pdf_get_metadata for /inputs/report.pdf returned FILE_NOT_FOUND. Every tool takes a local file path, and none of the run's files are in its container.
  evidence: survey 2026-10-05
  date: 2026-10-05
- ecosystem: npm
  package: "@azure/mcp"
  versions: 3.0.0-beta.49
  list: does-not-run-here
  reason: musl-native
  runtime: Node 24.21.0
  observed: "Installed; at start it failed to run its bundled program (spawn …/azmcp ENOENT): azmcp is built for glibc (its interpreter is /lib64/ld-linux-x86-64.so.2), and the runtime image is musl. It is also started with a subcommand (server start), which the runner does not pass."
  evidence: survey 2026-10-05
  date: 2026-10-05
- ecosystem: npm
  package: "@bytebase/dbhub"
  versions: 1.4.0
  list: does-not-run-here
  reason: non-443-port
  runtime: Node 24.21.0
  observed: Installed; exited at start asking for a database connection (--dsn, --demo, or DSN). A DSN can be given in env, but the databases it connects to listen on their own ports (5432, 3306, …), which a declared server cannot reach.
  evidence: survey 2026-10-05
  date: 2026-10-05
