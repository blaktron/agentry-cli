schemaVersion: "2"
name: drafter
namespace: agentry
version: 1.3.0
summary: "Drafts a QuickAgent from a description, searching the registry and the web; AI Review reads every result first."
license: MIT
authors:
  - name: Agentry
modes: [autonomous]
entrypoints:
  instruction: AGENT.md
capabilities:
  network:
    egress: none
  filesystem:
    read: none
    write: none
  exec: none
publish:
  include: [agent.yaml, AGENT.md, output.schema.json, README.md, LICENSE]
