schemaVersion: "2"
name: assistant
namespace: agentry
version: 1.20.1
summary: "A personal assistant that keeps its conversation with you across sessions, on your computer."
license: MIT
authors:
  - name: Agentry
modes: [persistent]
entrypoints:
  instruction: INSTRUCTION.md
interactive:
  opening: "Hello again. What can I help you with?"
capabilities:
  network:
    egress: none
  filesystem:
    read: none
    write: none
  exec: none
  persistent:
    clock: true
    memory: true
    skills: true
    secrets: [FASTMAIL_TOKEN, BRAVE_API_KEY]
    selfConfigure: true
    helper: true
    meetings: true
    desktop: true
    calendars: true
    mail: [google, microsoft, fastmail]
    imageServers: [google-workspace, microsoft-365]
publish:
  include: [agent.yaml, INSTRUCTION.md, README.md, LICENSE, "memory/**", "skills/**"]
