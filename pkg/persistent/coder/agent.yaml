schemaVersion: "2"
name: coder
namespace: agentry
version: 1.7.1
summary: "A coding agent that keeps its projects and conversation between starts, on your computer."
license: MIT
authors:
  - name: Agentry
modes: [persistent]
entrypoints:
  instruction: INSTRUCTION.md
capabilities:
  network:
    egress: none
  filesystem:
    read: none
    write: none
  exec: none
  persistent:
    skills: true
    secrets: [BRAVE_API_KEY]
    coder: true
    desktop: true
publish:
  include: [agent.yaml, INSTRUCTION.md, README.md, LICENSE, "skills/**"]
