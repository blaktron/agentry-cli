schemaVersion: "2"
name: knowledge-creator
namespace: agentry
version: 1.5.0
summary: "Builds and extends a knowledge pack: compiles documents, or researches a brief, into an LLM wiki of cited pages, section by section."
license: MIT
authors:
  - name: Agentry
modes: [autonomous]
entrypoints:
  instruction: INSTRUCTION.md
capabilities:
  network:
    egress: none
  filesystem:
    read: none
    write: none
  exec: none
  dataAccess: [files]
knowledge:
  ships:
    - name: pack-writing-guide
publish:
  include: [agent.yaml, INSTRUCTION.md, README.md, LICENSE, "knowledge/**"]
