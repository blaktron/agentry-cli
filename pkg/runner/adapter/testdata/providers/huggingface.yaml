# generated by agentry run — do not edit (docker-agent adapter)
version: "16"
models:
  main:
    provider: huggingface
    model: openai/gpt-oss-120b:groq
agents:
  root:
    model: main
    description: a test agent
    instruction: |
      Do the thing.
    safety: autonomous
    toolsets:
      - type: mcp
        remote:
          url: http://gateway:8811/mcp
          transport_type: streamable
          headers:
            Authorization: Bearer ${env.MCP_GATEWAY_TOKEN}
        allow_private_ips: true
    redact_secrets: false
    hooks:
      pre_tool_use:
        - matcher: '*'
          hooks:
            - type: builtin
              command: redact_secrets
      tool_response_transform:
        - matcher: '|[^rs](?s:.*)|r(?:|[^e](?s:.*)|e(?:|[^a](?s:.*)|a(?:|[^d](?s:.*)|d(?:|[^_](?s:.*)|_(?:|[^i](?s:.*)|i(?:|[^n](?s:.*)|n(?:|[^p](?s:.*)|p(?:|[^u](?s:.*)|u(?:|[^t](?s:.*)|t(?:(?s:.+)))))))))))|s(?:|[^e](?s:.*)|e(?:|[^a](?s:.*)|a(?:|[^r](?s:.*)|r(?:|[^c](?s:.*)|c(?:|[^h](?s:.*)|h(?:|[^_](?s:.*)|_(?:|[^i](?s:.*)|i(?:|[^n](?s:.*)|n(?:|[^p](?s:.*)|p(?:|[^u](?s:.*)|u(?:|[^t](?s:.*)|t(?:|[^s](?s:.*)|s(?:(?s:.+))))))))))))))'
          hooks:
            - type: builtin
              command: redact_secrets
      pre_compact:
        - type: command
          command: 'printf ''%s\n'' ''Keep, under these headings: the task, in the words the person used; the checklist, every step with its status, copied from the latest checklist result above; done, in progress, and blocked with why; the next step; the files, paths and identifiers in play; the constraints the task set and the approaches that failed.'''
    cold_cache_clear:
      after: 1h
      keep_turns: 2
      keep_browser: 2
    compaction_notes: checklist.md in your scratch folder, which the checklist tool reads
    length_recovery: true
    max_tool_result_tokens: 24576
    compaction_threshold: 0.8
