# generated by agentry run — gateway server catalog
registry:
  agentry-tools:
    description: Agentry QuickAgent tools server (generated per run)
    title: QuickAgent Tools
    type: server
    image: agentry-runner:test
    command:
      - tools
      - --spec
      - /etc/agentry/toolspec.json
    longLived: true
    volumes:
      - '@@RUN_CFG@@/gateway/toolspec.json:/etc/agentry/toolspec.json:ro'
      - '@@RUN_INPUTS@@:/inputs:ro'
      - '@@RUN_INPUTS_TEXT@@:/inputs-text:ro'
      - '@@RUN_KNOWLEDGE@@:/knowledge:ro'
      - '@@RUN_CFG@@/turns:/run/agentry/turns:ro'
      - '@@RUN_OUT@@:/out:rw'
    disableNetwork: true
  agentry-desktop-blender:
    description: 'Agentry''s desktop link: blender on the person''s computer, through its installed server, answered by Agentry Desktop (generated per run)'
    title: blender
    type: server
    image: agentry-runner:test
    command:
      - desktoplink
      - --server
      - blender
    user: '@@RUN_DESKTOP_USER@@'
    longLived: true
    volumes:
      - '@@RUN_DESKTOP_MOUNT@@'
    disableNetwork: true
  agentry-desktop-computer:
    description: 'Agentry''s desktop link: computer use on the person''s computer, the windows they allowed, answered by Agentry Desktop (generated per run)'
    title: Computer use
    type: server
    image: agentry-runner:test
    command:
      - desktoplink
      - --server
      - computer
    user: '@@RUN_DESKTOP_USER@@'
    longLived: true
    volumes:
      - '@@RUN_DESKTOP_MOUNT@@'
    disableNetwork: true
