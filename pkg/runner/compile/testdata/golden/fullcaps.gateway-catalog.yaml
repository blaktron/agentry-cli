# generated by agentry run — gateway server catalog
registry:
  agentry-tools:
    description: Agentry QuickAgent tools server (generated per run)
    title: QuickAgent Tools
    type: server
    image: agentry-runner-exec:test-17262807b507
    command:
      - tools
      - --spec
      - /etc/agentry/toolspec.json
    longLived: true
    volumes:
      - '@@RUN_CFG@@/gateway/toolspec.json:/etc/agentry/toolspec.json:ro'
      - '@@RUN_WORKSPACE@@:/workspace:ro'
      - '@@RUN_WORKSPACE@@/notes/summary.md:/workspace/notes/summary.md:rw'
      - '@@RUN_WORKSPACE@@/reports:/workspace/reports:rw'
      - '@@RUN_INPUTS@@:/inputs:ro'
      - '@@RUN_INPUTS_TEXT@@:/inputs-text:ro'
      - '@@RUN_KNOWLEDGE@@:/knowledge:ro'
      - '@@RUN_OUT@@:/out:rw'
    allowHosts:
      - api.example.com:443
      - api.other.net:443
    secrets:
      - name: agentry-tools.example_token
        env: EXAMPLE_TOKEN
