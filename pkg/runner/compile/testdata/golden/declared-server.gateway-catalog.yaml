# generated by agentry run — gateway server catalog (RUNNER-PLAN §R4)
registry:
  agentry-tools:
    description: Agentry QuickAgent tools server (generated per run)
    title: QuickAgent Tools
    type: server
    image: agentry-runner:test
    command:
      - tools
      - --spec
      - /etc/agentry/toolspec.json
    longLived: true
    volumes:
      - '@@RUN_CFG@@/gateway/toolspec.json:/etc/agentry/toolspec.json:ro'
      - '@@RUN_INPUTS@@:/inputs:ro'
      - '@@RUN_INPUTS_TEXT@@:/inputs-text:ro'
      - '@@RUN_KNOWLEDGE@@:/knowledge:ro'
      - '@@RUN_OUT@@:/out:rw'
    disableNetwork: true
  mcp-npm-scope-server-x:
    description: declared MCP server @scope/server-x@1.2.3 (npm), installed per-signature
    title: '@scope/server-x'
    type: server
    image: node:22-alpine
    command:
      - /opt/agentry-mcp/npm-scope-server-x/node_modules/.bin/server-x
    longLived: true
    volumes:
      - '@@RUN_SERVERS@@/npm-scope-server-x:/opt/agentry-mcp/npm-scope-server-x:ro'
    allowHosts:
      - api.github.com:443/tcp
    secrets:
      - name: mcp-npm-scope-server-x.github_pat
        env: GITHUB_PAT
    env:
      - name: GITHUB_PERMISSION
        value: read-only
